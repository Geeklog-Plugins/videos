name: Build installable Videos archive

on:
  workflow_dispatch:
  push:
    branches:
      - 0.19.0
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Normalize admin language and UI
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/migrate-admin-language.py
          grep -Fq 'function VIDEOS_adminText($key)' functions.inc
          grep -Fq 'VIDEOS ADMIN LANGUAGE KEYS 0.19.0' language/english.php
          grep -Fq 'VIDEOS ADMIN LANGUAGE KEYS 0.19.0' language/french_france.php
          grep -Fq 'VIDEOS ADMIN UNIFIED UI 0.19.0' public_html/css/admin.css

      - name: Lint PHP sources
        id: lint
        shell: bash
        run: |
          set +e
          : > lint-report.txt
          status=0
          while IFS= read -r -d '' file; do
            output=$(php -l "$file" 2>&1)
            code=$?
            if [ "$code" -ne 0 ]; then
              status=1
              printf '%s\n%s\n\n' "$file" "$output" >> lint-report.txt
            fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0)
          if [ "$status" -ne 0 ]; then
            cat lint-report.txt
            exit 1
          fi
          rm -f lint-report.txt

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: videos-admin-lint-report
          path: lint-report.txt
          if-no-files-found: ignore

      - name: Validate admin localization
        shell: bash
        run: |
          set -euo pipefail
          for file in admin/index.php admin/actions.php admin/stats.php admin/moderation.php; do
            if grep -nE "'(Vue générale|Repères|Ajouter une vidéo|Configuration|Voir le catalogue|Curation vidéo|Catalogue permanent|Maintenance|Contenu public et éditorial|Activité YouTube API|Intégration Geeklog|SEO vidéo|Modérer|Chaînes prioritaires)'" "$file"; then
              echo "Hard-coded admin language remains in $file" >&2
              exit 1
            fi
          done
          grep -Fq 'VIDEOS_adminText(' admin/index.php
          grep -Fq 'VIDEOS_adminText(' admin/actions.php
          grep -Fq 'VIDEOS_adminText(' admin/stats.php

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="videos_0.19.0_2.1.1.zip"
          rm -rf build
          mkdir -p build/videos dist
          rm -f dist/videos_*.zip
          rsync -a ./ build/videos/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='tools/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='*.cache' \
            --exclude='videos_*.zip'
          cd build
          zip -q -r "../dist/${ARCHIVE}" videos
          cd ..
          unzip -t "dist/${ARCHIVE}"
          unzip -p "dist/${ARCHIVE}" videos/functions.inc | grep -Fq 'function VIDEOS_adminText'
          unzip -p "dist/${ARCHIVE}" videos/language/english.php | grep -Fq 'VIDEOS ADMIN LANGUAGE KEYS 0.19.0'
          unzip -p "dist/${ARCHIVE}" videos/language/french_france.php | grep -Fq 'VIDEOS ADMIN LANGUAGE KEYS 0.19.0'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/admin.css | grep -Fq 'VIDEOS ADMIN UNIFIED UI 0.19.0'

      - name: Commit normalized sources and archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            admin/index.php admin/actions.php admin/stats.php admin/moderation.php \
            functions.inc \
            language/english.php language/french_france.php \
            public_html/css/admin.css \
            tools/migrate-admin-language.py \
            dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Externalize and unify Videos admin interface"
          git push origin "HEAD:${GITHUB_REF_NAME}"
