name: Build installable Videos archive

on:
  workflow_dispatch:
  push:
    branches:
      - 0.19.0
    paths-ignore:
      - dist/**

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Normalize 0.19.0 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          for name in ('videos.css', 'autotag.css', 'block.css'):
              path = Path('public_html/css') / name
              text = path.read_text(encoding='utf-8')
              text = text.replace('#ff0000', '#e62117')
              text = text.replace('#cc0000', '#c51f17')
              path.write_text(text, encoding='utf-8')

          path = Path('functions.inc')
          text = path.read_text(encoding='utf-8')
          old = """    if (is_file($cssPath)) {
        clearstatcache(true, $cssPath);
        $modified = @filemtime($cssPath);
        if ($modified !== false && $modified > 0) {
            $version .= '-' . (int) $modified;
        }
    }
"""
          new = """    $modified = false;
    if (is_file($cssPath)) {
        clearstatcache(true, $cssPath);
        $modified = @filemtime($cssPath);
    }

    if ($modified === false || $modified <= 0) {
        clearstatcache(true, __FILE__);
        $modified = @filemtime(__FILE__);
    }

    if ($modified !== false && $modified > 0) {
        $version .= '-' . (int) $modified;
    }
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Unable to locate CSS timestamp block')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          php -l functions.inc
          grep -F '#e62117' public_html/css/videos.css
          grep -F '#e62117' public_html/css/autotag.css
          grep -F '#e62117' public_html/css/block.css
          grep -F 'filemtime(__FILE__)' functions.inc

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0)

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="videos_0.19.0_2.1.1.zip"
          rm -rf build
          mkdir -p build/videos dist
          rm -f dist/videos_*.zip
          rsync -a ./ build/videos/ --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='dist/' --exclude='build/' --exclude='tools/' --exclude='.agents/' --exclude='.codex/' --exclude='.idea/' --exclude='.vscode/' --exclude='.env' --exclude='.env.*' --exclude='*.log' --exclude='*.tmp' --exclude='*.cache' --exclude='videos_*.zip'
          cd build
          zip -q -r "../dist/${ARCHIVE}" videos
          cd ..
          unzip -t "dist/${ARCHIVE}"
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/videos.css | grep -Fq '#e62117'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/autotag.css | grep -Fq '#e62117'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/block.css | grep -Fq '#e62117'
          unzip -p "dist/${ARCHIVE}" videos/functions.inc | grep -Fq 'filemtime(__FILE__)'

      - name: Commit normalized sources and archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions.inc public_html/css/videos.css public_html/css/autotag.css public_html/css/block.css dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refine Videos play red and CSS cache busting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
