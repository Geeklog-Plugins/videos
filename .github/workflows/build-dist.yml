name: Build installable Videos archive

on:
  workflow_dispatch:
  push:
    branches:
      - 0.19.0
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

concurrency:
  group: videos-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Ensure 0.19.0 upgrade path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('install_updates.php')
          text = path.read_text(encoding='utf-8')

          if "'0.18.0' => array(" not in text:
              old = """    '0.17.1' => array(
                  'next' => '0.18.0',
                  'callback' => 'videos_update_0_17_1_to_0_18_0'
              )
          );"""
              new = """    '0.17.1' => array(
                  'next' => '0.18.0',
                  'callback' => 'videos_update_0_17_1_to_0_18_0'
              ),
              '0.18.0' => array(
                  'next' => '0.19.0',
                  'callback' => 'videos_update_0_18_0_to_0_19_0'
              )
          );"""
              if old not in text:
                  raise SystemExit('Unable to locate the 0.17.1 migration entry')
              text = text.replace(old, new, 1)

          if 'function videos_update_0_18_0_to_0_19_0()' not in text:
              marker = 'function videos_update_0_17_1_to_0_18_0()'
              migration = """function videos_update_0_18_0_to_0_19_0()
          {
              // 0.19.0 changes PHP/CSS integration only; no SQL/config migration.
              return true;
          }

          """
              if marker not in text:
                  raise SystemExit('Unable to locate migration callback insertion point')
              text = text.replace(marker, migration + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          php -l install_updates.php
          grep -F "'0.18.0' => array(" install_updates.php
          grep -F "function videos_update_0_18_0_to_0_19_0()" install_updates.php

      - name: Ensure red public play buttons
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('public_html/css/videos.css')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'background: rgba(0, 0, 0, .7);',
              'background: #ff0000;',
              1
          )
          text = text.replace(
              'background: rgba(204, 0, 0, .9);',
              'background: #cc0000;',
              1
          )
          path.write_text(text, encoding='utf-8')
          PY

          grep -F 'background: #ff0000;' public_html/css/videos.css
          grep -F 'background: #cc0000;' public_html/css/videos.css

      - name: Ensure CSS timestamp cache busting
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('functions.inc')
          text = path.read_text(encoding='utf-8')
          old = """function VIDEOS_stylesheetLink($file)
          {
              global $_CONF;

              return '<link rel=\"stylesheet\" type=\"text/css\" href=\"'
                  . htmlspecialchars(
                      rtrim($_CONF['site_url'], '/') . '/videos/css/' . $file,
                      ENT_QUOTES,
                      'UTF-8'
                  )
                  . '?v=' . rawurlencode(VIDEOS_PLUGIN_VERSION) . '\">' . \"\\n\";
          }
          """
          new = """function VIDEOS_stylesheetLink($file)
          {
              global $_CONF;

              $version = VIDEOS_PLUGIN_VERSION;
              $cssPath = '';

              if (!empty($_CONF['path_html'])) {
                  $cssPath = rtrim($_CONF['path_html'], '/\\\\')
                      . '/videos/css/' . $file;
              }

              if ($cssPath === '' || !is_file($cssPath)) {
                  $cssPath = rtrim($_CONF['path'], '/\\\\')
                      . '/plugins/videos/public_html/css/' . $file;
              }

              if (is_file($cssPath)) {
                  clearstatcache(true, $cssPath);
                  $modified = @filemtime($cssPath);
                  if ($modified !== false && $modified > 0) {
                      $version .= '-' . (int) $modified;
                  }
              }

              return '<link rel=\"stylesheet\" type=\"text/css\" href=\"'
                  . htmlspecialchars(
                      rtrim($_CONF['site_url'], '/') . '/videos/css/' . $file,
                      ENT_QUOTES,
                      'UTF-8'
                  )
                  . '?v=' . rawurlencode($version) . '\">' . \"\\n\";
          }
          """

          if old in text:
              text = text.replace(old, new, 1)
          elif 'rawurlencode($version)' not in text or 'filemtime($cssPath)' not in text:
              raise SystemExit('Unable to locate VIDEOS_stylesheetLink() for cache-busting update')

          path.write_text(text, encoding='utf-8')
          PY

          php -l functions.inc
          grep -F 'filemtime($cssPath)' functions.inc
          grep -F 'rawurlencode($version)' functions.inc

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' -not -path './dist/*' -print0)

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="videos_0.19.0_2.1.1.zip"
          rm -rf build
          mkdir -p build/videos dist
          rm -f dist/videos_*.zip

          rsync -a ./ build/videos/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='tools/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='*.cache' \
            --exclude='videos_*.tar.gz' \
            --exclude='videos_*.zip'

          cd build
          zip -q -r "../dist/${ARCHIVE}" videos
          cd ..

          test -s "dist/${ARCHIVE}"
          unzip -t "dist/${ARCHIVE}"

          # Verify the CSS split introduced in 0.19.0 is packaged.
          for required in \
            videos/public_html/css/videos.css \
            videos/public_html/css/autotag.css \
            videos/public_html/css/block.css \
            videos/public_html/css/admin.css; do
            if ! zipinfo -1 "dist/${ARCHIVE}" | grep -Fxq "$required"; then
              echo "Missing required package file: $required" >&2
              exit 1
            fi
          done

          # Verify the migration chain reaches the archive version.
          unzip -p "dist/${ARCHIVE}" videos/install_updates.php \
            | grep -Fq "'next' => '0.19.0'"
          unzip -p "dist/${ARCHIVE}" videos/install_updates.php \
            | grep -Fq 'function videos_update_0_18_0_to_0_19_0()'

          # Verify red play-button styling is packaged.
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/videos.css \
            | grep -Fq 'background: #ff0000;'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/autotag.css \
            | grep -Fq '#ff0000'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/block.css \
            | grep -Fq '#ff0000'

          # Verify CSS URLs use the CSS file timestamp for cache busting.
          unzip -p "dist/${ARCHIVE}" videos/functions.inc \
            | grep -Fq 'filemtime($cssPath)'
          unzip -p "dist/${ARCHIVE}" videos/functions.inc \
            | grep -Fq 'rawurlencode($version)'

          # Geeklog 2.2.2 rejects archive entries with unsafe names.
          # Keep package paths ASCII-only and reject hidden path components.
          while IFS= read -r entry; do
            case "$entry" in
              */) continue ;;
            esac
            if printf '%s' "$entry" | grep -qE '(^|/)\.'; then
              echo "Unsafe hidden archive entry: $entry" >&2
              exit 1
            fi
            if ! printf '%s' "$entry" | grep -qE '^[A-Za-z0-9_./-]+$'; then
              echo "Unsafe archive filename: $entry" >&2
              exit 1
            fi
          done < <(zipinfo -1 "dist/${ARCHIVE}")

          unzip -l "dist/${ARCHIVE}" | head -80

      - name: Commit generated archive and normalized sources
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="videos_0.19.0_2.1.1.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A install_updates.php functions.inc public_html/css/videos.css dist

          if git diff --cached --quiet; then
            echo "Sources and archive are already up to date."
            exit 0
          fi

          git commit -m "Normalize Videos 0.19.0 sources and rebuild ${ARCHIVE}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
