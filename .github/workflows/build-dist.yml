name: Build installable Videos archive

on:
  workflow_dispatch:
  push:
    branches:
      - 0.19.0
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Normalize admin UI
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/normalize-admin-ui.py
          grep -Fq 'function VIDEOS_adminNavigation($active)' functions.inc
          grep -Fq 'function VIDEOS_adminPageOpen($active, $pageTitle)' functions.inc
          grep -Fq 'VIDEOS ADMIN UNIFIED UI 0.19.0' public_html/css/admin.css
          grep -Fq "admin_remove_help" language/english.php
          grep -Fq "admin_remove_help" language/french_france.php
          grep -Fq 'global $LANG_VIDEOS;' admin/actions.php
          if grep -R -nF '{{videos_admin_' admin; then
            echo 'Unresolved Videos admin language token found.' >&2
            exit 1
          fi
          if grep -R -nE 'videos_(overview_nav|admin_section_nav|stats_nav|moderation_nav)\(' admin; then
            echo 'Legacy per-page navigation helper found.' >&2
            exit 1
          fi
          if grep -Fq 'function VIDEOS_adminRender(' functions.inc; then
            echo 'Legacy admin token renderer still exists.' >&2
            exit 1
          fi

      - name: Normalize storage upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/normalize-storage-upgrade.py
          grep -Fq 'public function migrateLegacyStorage()' classes/Videos_Bootstrap.php
          grep -Fq 'private function selectRuntimeRoot(' classes/Videos_Bootstrap.php
          grep -Fq '$bootstrap->migrateLegacyStorage()' install_updates.php
          grep -Fq 'Legacy data was preserved.' install_updates.php
          if grep -Fq '$this->migrateLegacyData($this->legacyDataRoot' classes/Videos_Bootstrap.php; then
            echo 'Runtime bootstrap still performs implicit storage migration.' >&2
            exit 1
          fi

      - name: Validate lifecycle events
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '$this->signalDeleted($videoId);' classes/Videos_PermanentPool.php
          grep -Fq 'foreach ($previousItems as $videoId => $item)' classes/Videos_PermanentPool.php
          grep -Fq '$this->signalChannelVideos($channelId, $afterExcluded);' classes/Videos_Moderation.php
          grep -Fq "function_exists('PLG_itemDeleted')" classes/Videos_Moderation.php
          grep -Fq "function_exists('PLG_itemDeleted')" classes/Videos_PermanentPool.php

      - name: Normalize semantic admin language keys
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/normalize-admin-language-semantic.py
          if grep -R -nE "text_[0-9a-f]{12}|VIDEOS_adminText\(|VIDEOS_localizeAdminText\(" \
              admin/index.php admin/actions.php admin/stats.php admin/moderation.php functions.inc; then
            echo 'Legacy hashed admin language reference remains.' >&2
            exit 1
          fi
          if grep -R -nE "LANG_VIDEOS_ADMIN(_TEXT)?|text_[0-9a-f]{12}" \
              language/english.php language/french_france.php; then
            echo 'Legacy hashed admin language table remains.' >&2
            exit 1
          fi
          grep -Fq "\$LANG_VIDEOS['admin_" admin/actions.php
          grep -Fq "\$LANG_VIDEOS['admin_" admin/stats.php

      - name: Validate semantic admin language keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          admin_files = [
              Path('admin/index.php'), Path('admin/actions.php'),
              Path('admin/stats.php'), Path('admin/moderation.php')
          ]
          lang_files = [Path('language/english.php'), Path('language/french_france.php')]

          used = set()
          for path in admin_files:
              used.update(re.findall(r"\$LANG_VIDEOS\['(admin_[A-Za-z0-9_]+)'\]", path.read_text(encoding='utf-8')))

          for path in lang_files:
              text = path.read_text(encoding='utf-8')
              defined = set(re.findall(r"\$LANG_VIDEOS\['(admin_[A-Za-z0-9_]+)'\]\s*=", text))
              defined.update(re.findall(r"'(admin_[A-Za-z0-9_]+)'\s*=>", text))
              missing = sorted(used - defined)
              if missing:
                  raise SystemExit(f'{path}: missing semantic admin keys: {", ".join(missing)}')

          print(f'Validated {len(used)} semantic admin language keys in English and French.')
          PY

      - name: Lint PHP sources
        id: lint
        shell: bash
        run: |
          set +e
          : > lint-report.txt
          status=0
          while IFS= read -r -d '' file; do
            output=$(php -l "$file" 2>&1)
            code=$?
            if [ "$code" -ne 0 ]; then
              status=1
              printf '%s\n%s\n\n' "$file" "$output" >> lint-report.txt
            fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0)
          if [ "$status" -ne 0 ]; then
            cat lint-report.txt
            exit 1
          fi
          rm -f lint-report.txt

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: videos-admin-lint-report
          path: lint-report.txt
          if-no-files-found: ignore

      - name: Validate admin structure
        shell: bash
        run: |
          set -euo pipefail
          for file in admin/index.php admin/actions.php admin/stats.php admin/moderation.php; do
            grep -Fq 'VIDEOS_adminPageOpen(' "$file"
            grep -Fq 'VIDEOS_adminPageClose()' "$file"
          done
          grep -Fq '$LANG_VIDEOS[' admin/index.php
          grep -Fq '$LANG_VIDEOS[' admin/actions.php
          grep -Fq '$LANG_VIDEOS[' admin/stats.php
          grep -Fq '$LANG_VIDEOS[' admin/moderation.php

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="videos_0.19.0_2.1.1.zip"
          rm -rf build
          mkdir -p build/videos dist
          rm -f dist/videos_*.zip
          rsync -a ./ build/videos/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='tools/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='*.cache' \
            --exclude='videos_*.zip'
          cd build
          zip -q -r "../dist/${ARCHIVE}" videos
          cd ..
          unzip -t "dist/${ARCHIVE}"
          unzip -p "dist/${ARCHIVE}" videos/functions.inc | grep -Fq 'function VIDEOS_adminPageOpen'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/admin.css | grep -Fq 'VIDEOS ADMIN UNIFIED UI 0.19.0'
          unzip -p "dist/${ARCHIVE}" videos/classes/Videos_Bootstrap.php | grep -Fq 'public function migrateLegacyStorage()'
          unzip -p "dist/${ARCHIVE}" videos/install_updates.php | grep -Fq '$bootstrap->migrateLegacyStorage()'
          unzip -p "dist/${ARCHIVE}" videos/classes/Videos_PermanentPool.php | grep -Fq '$this->signalDeleted($videoId);'
          unzip -p "dist/${ARCHIVE}" videos/classes/Videos_Moderation.php | grep -Fq '$this->signalChannelVideos($channelId, $afterExcluded);'
          if unzip -p "dist/${ARCHIVE}" videos/admin/actions.php | grep -Eq 'text_[0-9a-f]{12}|VIDEOS_adminText\('; then
            echo 'Legacy admin language reference found in archive.' >&2
            exit 1
          fi

      - name: Commit normalized sources and archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            admin/index.php admin/actions.php admin/stats.php admin/moderation.php \
            classes/Videos_Bootstrap.php classes/Videos_PermanentPool.php classes/Videos_Moderation.php \
            functions.inc install_updates.php \
            language/english.php language/french_france.php \
            public_html/css/admin.css \
            tools/normalize-admin-ui.py tools/normalize-storage-upgrade.py tools/normalize-admin-language-semantic.py \
            dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use semantic Videos admin language keys"
          git push origin "HEAD:${GITHUB_REF_NAME}"
