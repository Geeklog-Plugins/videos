name: Build installable Videos archive

on:
  workflow_dispatch:
  push:
    branches:
      - 0.19.0
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Normalize admin UI
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/normalize-admin-ui.py
          grep -Fq 'function VIDEOS_adminNavigation($active)' functions.inc
          grep -Fq 'function VIDEOS_adminPageOpen($active, $pageTitle)' functions.inc
          grep -Fq 'VIDEOS ADMIN UNIFIED UI 0.19.0' public_html/css/admin.css
          grep -Fq "admin_remove_help" language/english.php
          grep -Fq "admin_remove_help" language/french_france.php
          grep -Fq 'global $LANG_VIDEOS;' admin/actions.php
          if grep -R -nF '{{videos_admin_' admin; then
            echo 'Unresolved Videos admin language token found.' >&2
            exit 1
          fi
          if grep -R -nE 'videos_(overview_nav|admin_section_nav|stats_nav|moderation_nav)\(' admin; then
            echo 'Legacy per-page navigation helper found.' >&2
            exit 1
          fi
          if grep -Fq 'function VIDEOS_adminRender(' functions.inc; then
            echo 'Legacy admin token renderer still exists.' >&2
            exit 1
          fi

      - name: Validate admin language keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          admin_files = [Path('admin/actions.php'), Path('admin/stats.php')]
          lang_files = [Path('language/english.php'), Path('language/french_france.php')]

          used = set()
          for path in admin_files:
              used.update(re.findall(r"VIDEOS_adminText\('((?:text_)[0-9a-f]{12})'\)", path.read_text(encoding='utf-8')))

          if not used:
              raise SystemExit('No admin language keys found to validate.')

          for path in lang_files:
              text = path.read_text(encoding='utf-8')
              defined = set(re.findall(r"'((?:text_)[0-9a-f]{12})'\s*=>", text))
              missing = sorted(used - defined)
              if missing:
                  raise SystemExit(f'{path}: missing admin keys: {", ".join(missing)}')

          print(f'Validated {len(used)} admin language keys in English and French.')
          PY

      - name: Lint PHP sources
        id: lint
        shell: bash
        run: |
          set +e
          : > lint-report.txt
          status=0
          while IFS= read -r -d '' file; do
            output=$(php -l "$file" 2>&1)
            code=$?
            if [ "$code" -ne 0 ]; then
              status=1
              printf '%s\n%s\n\n' "$file" "$output" >> lint-report.txt
            fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0)
          if [ "$status" -ne 0 ]; then
            cat lint-report.txt
            exit 1
          fi
          rm -f lint-report.txt

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: videos-admin-lint-report
          path: lint-report.txt
          if-no-files-found: ignore

      - name: Validate admin structure
        shell: bash
        run: |
          set -euo pipefail
          for file in admin/index.php admin/actions.php admin/stats.php admin/moderation.php; do
            grep -Fq 'VIDEOS_adminPageOpen(' "$file"
            grep -Fq 'VIDEOS_adminPageClose()' "$file"
          done
          grep -Fq 'VIDEOS_adminText(' admin/index.php
          grep -Fq 'VIDEOS_adminText(' admin/actions.php
          grep -Fq 'VIDEOS_adminText(' admin/stats.php
          grep -Fq '$LANG_VIDEOS[' admin/moderation.php

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="videos_0.19.0_2.1.1.zip"
          rm -rf build
          mkdir -p build/videos dist
          rm -f dist/videos_*.zip
          rsync -a ./ build/videos/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='tools/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='*.cache' \
            --exclude='videos_*.zip'
          cd build
          zip -q -r "../dist/${ARCHIVE}" videos
          cd ..
          unzip -t "dist/${ARCHIVE}"
          unzip -p "dist/${ARCHIVE}" videos/functions.inc | grep -Fq 'function VIDEOS_adminPageOpen'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/admin.css | grep -Fq 'VIDEOS ADMIN UNIFIED UI 0.19.0'
          if unzip -p "dist/${ARCHIVE}" videos/admin/actions.php | grep -Fq '{{videos_admin_'; then
            echo 'Unresolved admin token found in archive.' >&2
            exit 1
          fi

      - name: Commit normalized sources and archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            admin/index.php admin/actions.php admin/stats.php admin/moderation.php \
            functions.inc \
            language/english.php language/french_france.php \
            public_html/css/admin.css \
            tools/normalize-admin-ui.py \
            dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize Videos admin interface"
          git push origin "HEAD:${GITHUB_REF_NAME}"