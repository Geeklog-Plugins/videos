name: Build installable Videos archive

on:
  workflow_dispatch:
  push:
    branches:
      - 0.19.0
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Normalize 0.19.0 sources
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/#ff0000/#e62117/g; s/#cc0000/#c51f17/g' public_html/css/videos.css public_html/css/autotag.css public_html/css/block.css
          sed -i "s/\$version = VIDEOS_PLUGIN_VERSION;/\$version = VIDEOS_PLUGIN_VERSION . '-' . (int) @filemtime(__FILE__);/" functions.inc
          php -l functions.inc
          grep -F '#e62117' public_html/css/videos.css
          grep -F '#e62117' public_html/css/autotag.css
          grep -F '#e62117' public_html/css/block.css
          grep -F "VIDEOS_PLUGIN_VERSION . '-' . (int) @filemtime(__FILE__)" functions.inc

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0)

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="videos_0.19.0_2.1.1.zip"
          rm -rf build
          mkdir -p build/videos dist
          rm -f dist/videos_*.zip
          rsync -a ./ build/videos/ --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='dist/' --exclude='build/' --exclude='tools/' --exclude='.agents/' --exclude='.codex/' --exclude='.idea/' --exclude='.vscode/' --exclude='.env' --exclude='.env.*' --exclude='*.log' --exclude='*.tmp' --exclude='*.cache' --exclude='videos_*.zip'
          cd build
          zip -q -r "../dist/${ARCHIVE}" videos
          cd ..
          unzip -t "dist/${ARCHIVE}"
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/videos.css | grep -Fq '#e62117'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/autotag.css | grep -Fq '#e62117'
          unzip -p "dist/${ARCHIVE}" videos/public_html/css/block.css | grep -Fq '#e62117'
          unzip -p "dist/${ARCHIVE}" videos/functions.inc | grep -Fq "VIDEOS_PLUGIN_VERSION . '-' . (int) @filemtime(__FILE__)"

      - name: Commit normalized sources and archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions.inc public_html/css/videos.css public_html/css/autotag.css public_html/css/block.css dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refine Videos play red and CSS cache busting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
